name: Publish container

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: Test and publish image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          platforms: linux/amd64
          tags: fileslop:verify

      - name: Start amd64 image
        run: >-
          docker run --detach --rm --name fileslop-verify
          --publish 127.0.0.1:3000:3000
          --env BASE_URL=http://127.0.0.1:3000
          fileslop:verify

      - name: Wait for container
        run: |
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:3000/p/verify.txt; then
              exit 0
            fi
            sleep 1
          done
          docker logs fileslop-verify
          exit 1

      - name: Verify round trip
        run: bun run verify:round-trip http://127.0.0.1:3000

      - name: Stop verification container
        if: always()
        run: docker rm --force fileslop-verify

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.sha }}
